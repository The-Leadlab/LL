services:
  - type: web
    name: leadlab-backend
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "https://the-leadlab.com,https://www.the-leadlab.com"
      - key: OUTREACH_WORKER_SECRET
        sync: false
      - key: OUTREACH_WORKER_BATCH_SIZE
        value: "25"

  # Processes due outreach_jobs + sequence_steps every minute.
  # Requires OUTREACH_WORKER_SECRET and API base URL on the cron job.
  - type: cron
    name: leadlab-outreach-worker
    env: python
    region: frankfurt
    plan: free
    rootDir: backend
    schedule: "*/2 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os,urllib.request; req=urllib.request.Request(os.environ['OUTREACH_TICK_URL'], method='POST', headers={'X-Outreach-Worker-Secret': os.environ['OUTREACH_WORKER_SECRET']}); urllib.request.urlopen(req, timeout=55); print('tick ok')"
    envVars:
      - key: OUTREACH_WORKER_SECRET
        sync: false
      - key: OUTREACH_TICK_URL
        value: "https://api.the-leadlab.com/api/v1/outreach/worker/tick"
