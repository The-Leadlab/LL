<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/png" href="/images/leadlab-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>LeadLab — Lead Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // Color mode before paint — default follows OS (system).
      (function () {
        try {
          var migrated = localStorage.getItem('leadlab-theme-v3') === '1';
          var raw = localStorage.getItem('leadlab-theme')
            || localStorage.getItem('theme')
            || localStorage.getItem('dashboard-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var pref = 'system';
          if (migrated && (raw === 'dark' || raw === 'light' || raw === 'system')) {
            pref = raw;
          } else {
            pref = raw === 'dark' ? 'dark' : 'system';
            localStorage.setItem('leadlab-theme', pref);
            localStorage.setItem('leadlab-theme-v3', '1');
            localStorage.setItem('leadlab-theme-v2', '1');
          }
          var next = pref === 'system' ? (systemDark ? 'dark' : 'light') : pref;
          localStorage.removeItem('theme');
          localStorage.removeItem('dashboard-theme');
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(next === 'dark' ? 'dark' : 'light');
          document.documentElement.style.colorScheme = next === 'dark' ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', next === 'dark' ? '#020617' : '#ffffff');
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
      // Handle client-side routing
      (function() {
        const path = window.location.pathname;
        const htmlFilePattern = /\.html$/;
        const apiPattern = /^\/api\//;
        
        // Don't redirect API calls or direct HTML file requests
        if (!htmlFilePattern.test(path) && !apiPattern.test(path)) {
          sessionStorage.setItem('path', path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
